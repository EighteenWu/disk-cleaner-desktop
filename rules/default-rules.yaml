  - id: adobe.media.cache.review
    name: Adobe 媒体缓存
    app: Adobe Creative Cloud
    category: 应用缓存
    level: 需要确认
    default: false
    paths:
      - "%APPDATA%\\Adobe\\Common\\Media Cache"
      - "%APPDATA%\\Adobe\\Common\\Media Cache Files"
    clean: contents
    keep_days: 14
    note: Premiere、After Effects 为音视频素材生成的预览和波形缓存，做视频的机器上常有几十 GB。删除不影响工程文件和素材，但正在剪的项目再次打开时要重新分析素材，大工程可能要等很久。请先关闭 Adobe 软件。

  - id: steam.cache
    name: Steam 着色器与下载缓存
    app: Steam
    category: 游戏缓存
    level: 谨慎清理
    default: false
    paths:
      - "%PROGRAMFILES(X86)%\\Steam\\steamapps\\shadercache"
      - "%PROGRAMFILES(X86)%\\Steam\\steamapps\\downloading"
      - "%PROGRAMFILES(X86)%\\Steam\\steamapps\\temp"
    clean: contents
    keep_days: 7
    note: Steam 预编译的游戏着色器和未完成的下载分片，常见几 GB 到几十 GB。删除不影响已装好的游戏和存档，但游戏首次进入会重新编译着色器（可能卡顿），未下完的游戏要从头下。只覆盖默认安装位置，装在其他盘的 Steam 库不在此列。请先退出 Steam。
    close:
      - steam.exe

  - id: wechat.file.cache.review
    name: 微信文件缓存
    app: 微信
    category: 应用缓存
    level: 需要确认
    default: false
    paths:
      - "%DOCUMENTS%\\WeChat Files\\*\\FileStorage\\Cache"
      - "%DOCUMENTS%\\WeChat Files\\*\\FileStorage\\Video"
      - "%DOCUMENTS%\\WeChat Files\\*\\FileStorage\\Image"
    clean: contents
    keep_days: 60
    note: 微信自动下载的图片、视频和临时文件，长期使用常有几十 GB。注意：聊天里收到的图片和视频删掉后，如果对方已过期或撤回就再也点不开了，只有服务器还留着的才能重新下载。文档和收到的文件不在清理范围内。请先退出微信。
    close:
      - WeChat.exe
